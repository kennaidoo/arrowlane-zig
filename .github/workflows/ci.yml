name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Format
        run: zig fmt --check --exclude src/vendor .
      - name: Test
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseSafe

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fuzz parsers
        run: zig build fuzz

  linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: bash tools/fetch-zstd.sh
      - run: zig build test
      - run: zig build fuzz
      - run: zig build -Doptimize=ReleaseSafe

  windows-arm64-build:
    name: windows-arm64-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Build ARM64
        run: zig build -Dtarget=aarch64-windows -Doptimize=ReleaseSafe

  freebsd-arm64:
    name: freebsd-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          arch: aarch64
          mem: 8192
          prepare: |
            pkg install -y bash curl
          run: |
            export ARROWLAND_SHM_DIR=/tmp/arrowlane-shm
            mkdir -p "$ARROWLAND_SHM_DIR"
            mkdir -p /opt
            curl -fsSL https://ziglang.org/download/0.17.0/zig-aarch64-freebsd-0.17.0.tar.xz -o /tmp/zig.tar.xz
            tar -xJf /tmp/zig.tar.xz -C /opt
            ln -s /opt/zig-aarch64-freebsd-0.17.0/zig /usr/local/bin/zig
            bash tools/fetch-zstd.sh
            zig build test
            zig build -Doptimize=ReleaseSafe
