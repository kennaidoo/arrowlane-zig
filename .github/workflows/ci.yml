name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: test-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Format
        run: zig fmt --check --exclude src/vendor .
      - name: Test
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseSafe

  test-other:
    name: test-other
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Format
        run: zig fmt --check --exclude src/vendor .
      - name: Test
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseSafe

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fuzz parsers
        run: zig build fuzz

  linux-arm64:
    name: linux-arm64
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: bash tools/fetch-zstd.sh
      - run: zig build test
      - run: zig build fuzz
      - run: zig build -Doptimize=ReleaseSafe

  windows-arm64-build:
    name: windows-arm64-build
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Build ARM64
        run: zig build -Dtarget=aarch64-windows -Doptimize=ReleaseSafe
