name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Fetch zstd
        run: bash tools/fetch-zstd.sh
      - name: Format
        run: zig fmt --check --exclude src/vendor .
      - name: Test
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseSafe
